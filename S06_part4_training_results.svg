  <text x="1290" y="1686.0" font-size="11" fill="#0F172A">• Epochs: <tspan font-weight="700">50</tspan> · imgsz: <tspan font-weight="700">96</tspan> · Batch: <tspan font-weight="700">64</tspan></text>
  <text x="1290" y="1702.0" font-size="11" fill="#0F172A">• Optimizer: <tspan font-weight="700">AdamW</tspan> (LR 0.001, Momentum 0.9)</text>
  <text x="1290" y="1718.0" font-size="11" fill="#0F172A">• Warmup: 3 epochs · weight_decay 0.0005</text>
  <text x="1290" y="1734.0" font-size="11" fill="#0F172A">• Early Stopping: <tspan font-weight="700">patience 15</tspan></text>
