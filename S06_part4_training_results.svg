  <line x1="910" y1="1778.0" x2="1620" y2="1778.0" stroke="#EF4444" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="930" y="1798.0" font-size="11" fill="#0F172A">• fliplr = <tspan font-weight="700" fill="#991B1B">0.0</tspan> (좌우 반전 금지)</text>
  <text x="1290" y="1798.0" font-size="11" fill="#0F172A">• flipud = <tspan font-weight="700" fill="#991B1B">0.0</tspan> (상하 반전 금지)</text>
  <text x="930" y="1816.0" font-size="11" fill="#0F172A">• degrees = <tspan font-weight="700" fill="#991B1B">0.0</tspan> (회전 금지 — 아이콘 비대칭성)</text>
  <text x="1290" y="1816.0" font-size="11" fill="#0F172A">• translate = 0.05 · scale = 0.10</text>
  <text x="930" y="1834.0" font-size="11" fill="#0F172A">• erasing = 0.10 (Random Erasing)</text>
  <text x="1290" y="1834.0" font-size="11" fill="#0F172A">• mixup = <tspan font-weight="700" fill="#991B1B">0.0</tspan> (분류 경계 흐려짐 방지)</text>

