  <text x="100" y="1686.0" font-size="11" fill="#0F172A">• 하드웨어: NVIDIA <tspan font-weight="700">A100-SXM4-40GB</tspan> (Colab)</text>
  <text x="100" y="1702.0" font-size="11" fill="#0F172A">• 프레임워크: <tspan font-weight="700">Ultralytics 8.4.48</tspan> (YOLO26l)</text>
  <text x="100" y="1718.0" font-size="11" fill="#0F172A">• 모델 베이스: yolo26 가중치 사용</text>
  <text x="100" y="1734.0" font-size="11" fill="#0F172A">• 학습 결과 경로: <tspan font-family="Consolas, monospace">yolo_runs/yolov26l_..._5</tspan></text>
  <rect x="460" y="1644.0" width="370" height="100" rx="6" fill="#EFF6FF"/>
  <text x="645" y="1662.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">하이퍼파라미터</text>
  <line x1="480" y1="1668.0" x2="810" y2="1668.0" stroke="#3B82F6" stroke-width="0.8"/>
  <text x="480" y="1686.0" font-size="11" fill="#0F172A">• Epochs: <tspan font-weight="700">100</tspan> · imgsz: <tspan font-weight="700">640 × 640</tspan> · Batch: <tspan font-weight="700">16</tspan> (32→OOM)</text>
  <text x="480" y="1702.0" font-size="11" fill="#0F172A">• Optimizer: <tspan font-weight="700">AdamW</tspan> (LR 0.001429, Momentum 0.9)</text>
  <text x="480" y="1718.0" font-size="11" fill="#0F172A">• Loss: Box Loss + Class Loss + DFL Loss</text>
  <text x="480" y="1734.0" font-size="11" fill="#0F172A">• Aug: <tspan font-weight="700">Albumentations</tspan> (Blur, MedianBlur, ToGray, CLAHE)</text>
  <rect x="80" y="1754.0" width="750" height="98" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-dasharray="3,2"/>
