  <text x="910" y="1702.0" font-size="11" fill="#0F172A">• 모델: <tspan font-weight="700">YOLO-cls</tspan> (base: yolo26n-cls.pt)</text>
  <text x="910" y="1718.0" font-size="11" fill="#0F172A">• 학습 스크립트: <tspan font-family="Consolas, monospace">train_portrait_classifier.py</tspan></text>
  <text x="910" y="1734.0" font-size="11" fill="#0F172A">• 운영: conda env <tspan font-family="Consolas, monospace">lolcoach</tspan>, CPU 추론 가능</text>
