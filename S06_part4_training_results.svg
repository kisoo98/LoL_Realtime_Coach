  <line x1="100" y1="1778.0" x2="810" y2="1778.0" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="120" y="1798.0" font-size="11" fill="#0F172A">• 파일 크기: <tspan font-weight="700">53.0 MB</tspan></text>
